[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "busca-vagas-local"
version = "0.1.0"
description = "Busca local na Gupy com perfil privado e revisão explicável"
requires-python = ">=3.11"
dependencies = ["streamlit==1.65.0", "playwright==1.63.0", "beautifulsoup4==4.14.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"job_hunter.domain" = ["municipalities.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
